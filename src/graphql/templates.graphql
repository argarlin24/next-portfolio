query allTemplatePagesSlugs {
  allTemplatePages {
    internalName
    slug
  }
}

query templatePage($slug: String!) {
  templatePage(filter: { slug: { eq: $slug } }) {
    id
    slug
    components {
      ... on ComponentNavRecord {
        _modelApiKey
        navItems {
          id
          label
          url
        }
      }
      ... on ComponentHeroRecord {
        _modelApiKey
        id
        headingKicker
        heading
        description
        featuredImage {
          responsiveImage(imgixParams: { auto: format }) {
            srcSet
            webpSrcSet
            sizes
            src
            width
            height
            aspectRatio
            alt
            title
            base64
          }
        }
      }
      ... on ComponentSwitcherRecord {
        _modelApiKey
        id
        heading
        description
        projects {
          id
          slug
          heading
          description
          projectUrl
          featuredImage {
            responsiveImage(imgixParams: { auto: format }) {
              srcSet
              webpSrcSet
              sizes
              src
              width
              height
              aspectRatio
              alt
              title
              base64
            }
          }
          tags {
            title
          }
        }
      }
      ... on ComponentSingleInstanceRecord {
        _modelApiKey
        singleInstanceId
      }
    }
  }
}
